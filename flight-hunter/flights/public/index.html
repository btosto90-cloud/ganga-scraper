<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flight Hunter · Vigilante de ruta</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07090f;
    --surface: #131826;
    --surface-2: #1a2030;
    --border: #2a3247;
    --text: #eef2f9;
    --text-2: #aab3c8;
    --gold: #f5b942;
    --emerald: #34d399;
    --emerald-soft: rgba(52,211,153,0.14);
    --amber: #fbbf24;
    --amber-soft: rgba(251,191,36,0.14);
    --rose: #fb7185;
    --rose-soft: rgba(251,113,133,0.14);
    --fs-display: 'Syne', system-ui, sans-serif;
    --fs-body: 'Manrope', system-ui, sans-serif;
    --fs-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--fs-body); font-weight: 400;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding: 0 16px 64px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { padding: 32px 0 8px; }
  .route {
    font-family: var(--fs-display); font-weight: 800;
    font-size: clamp(28px, 6vw, 44px); letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .route .arrow { color: var(--gold); }
  .sub { color: var(--text-2); font-size: 15px; margin-top: 6px; }
  .sub b { color: var(--text); font-weight: 600; }

  .hero {
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 24px; margin-top: 20px;
    display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
  }
  .hero .label { color: var(--text-2); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .hero .price { font-family: var(--fs-mono); font-weight: 700; font-size: clamp(40px, 10vw, 64px); line-height: 1; margin: 6px 0; }
  .hero .meta { color: var(--text-2); font-size: 15px; }
  .hero .meta b { color: var(--text); font-weight: 600; }
  .cta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .cta {
    display: inline-block; background: var(--gold); color: #1a1205;
    font-weight: 700; text-decoration: none; padding: 12px 18px; border-radius: 12px;
    font-size: 15px;
  }
  .cta:hover { filter: brightness(1.08); }
  .cta-2 {
    display: inline-block; background: transparent; color: var(--text);
    border: 1px solid var(--border); font-weight: 600; text-decoration: none;
    padding: 12px 16px; border-radius: 12px; font-size: 14px;
  }
  .cta-2:hover { border-color: var(--gold); color: var(--gold); }
  .xlinks { display: flex; gap: 8px; }
  .xlinks a { color: var(--text-2); text-decoration: none; font-weight: 700; font-size: 13px; }
  .xlinks a:hover { color: var(--gold); }
  .xlinks a.g { color: var(--gold); }

  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .b-low { background: var(--emerald-soft); color: var(--emerald); }
  .b-typical { background: var(--amber-soft); color: var(--amber); }
  .b-high { background: var(--rose-soft); color: var(--rose); }

  .note {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-top: 16px; color: var(--text-2); font-size: 14px;
  }
  .note b { color: var(--text); font-weight: 600; }

  h2 { font-family: var(--fs-display); font-weight: 700; font-size: 20px; margin: 32px 0 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  thead th { text-align: left; color: var(--text-2); font-weight: 600; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--surface); }
  .price-cell { font-family: var(--fs-mono); font-weight: 700; font-size: 16px; }
  .best-row { background: var(--emerald-soft); }
  td a { color: var(--gold); text-decoration: none; font-weight: 600; }
  td a:hover { text-decoration: underline; }

  .hist { display: flex; gap: 4px; align-items: flex-end; height: 80px; margin-top: 8px; }
  .hist .bar { flex: 1; background: var(--gold); border-radius: 3px 3px 0 0; min-height: 4px; opacity: 0.85; }
  .foot { color: var(--text-2); font-size: 13px; margin-top: 28px; text-align: center; }

  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="route" id="route">Cargando…</div>
    <div class="sub" id="window"></div>
  </header>

  <div id="content"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const fmtDate = s => {
  if (!s) return "—";
  const [y,m,d] = s.split("-");
  return `${d}/${m}`;
};
const lvlBadge = lvl => {
  if (lvl === "low") return '<span class="badge b-low">🟢 ganga</span>';
  if (lvl === "high") return '<span class="badge b-high">🔴 caro</span>';
  return '<span class="badge b-typical">🟡 normal</span>';
};
const stopsTxt = s => s === 0 ? "directo" : (s ? `${s} esc.` : "—");

async function load() {
  let d;
  try {
    const r = await fetch("./data/watch.json?t=" + Date.now());
    d = await r.json();
  } catch (e) {
    document.getElementById("route").textContent = "No pude cargar los datos.";
    return;
  }
  const o = d.route.origin, dest = d.route.destination;
  document.getElementById("route").innerHTML = `${o} <span class="arrow">→</span> ${dest}`;
  const w = d.window;
  document.getElementById("window").innerHTML =
    `Ida y vuelta · salida <b>${fmtDate(w.outbound[0])}–${fmtDate(w.outbound[1])}</b> · vuelta <b>${fmtDate(w.return[0])}–${fmtDate(w.return[1])}</b>`;

  const b = d.best;
  const mid = (b.typical_low && b.typical_high) ? (b.typical_low + b.typical_high)/2 : null;
  const disc = mid ? Math.round((1 - b.price_usd/mid)*100) : null;
  const typ = (b.typical_low && b.typical_high) ? `Típico de la ruta: USD ${Math.round(b.typical_low)}–${Math.round(b.typical_high)}` : "";

  let html = `
    <div class="hero">
      <div>
        <div class="label">Mejor precio ahora ${lvlBadge(b.price_level)}</div>
        <div class="price">USD ${b.price_usd}</div>
        <div class="meta">
          <b>${fmtDate(b.departure_date)} → ${fmtDate(b.return_date)}</b> ·
          ${b.airline || "—"} · ${stopsTxt(b.stops)}
          ${disc!==null && disc>0 ? ` · <b>~${disc}% bajo lo normal</b>` : ""}
        </div>
        <div class="meta" style="margin-top:4px">${typ}</div>
        <div class="cta-row">
          ${b.link ? `<a class="cta" href="${b.link}" target="_blank" rel="noopener">Ver en Google Flights →</a>` : ""}
          ${b.kiwi ? `<a class="cta-2" href="${b.kiwi}" target="_blank" rel="noopener">Kiwi (self-transfer)</a>` : ""}
          ${b.despegar ? `<a class="cta-2" href="${b.despegar}" target="_blank" rel="noopener">Despegar (cuotas AR)</a>` : ""}
        </div>
      </div>
      <div style="text-align:right">
        <div class="label">Mínimo registrado</div>
        <div class="price" style="font-size:32px;color:var(--emerald)">USD ${d.best_ever_usd}</div>
      </div>
    </div>

    <div class="note">
      Este vigilante escanea <b>solo esta ruta</b> a fondo (${d.results.length} combinaciones de fechas) y te
      avisa por <b>Telegram</b> apenas toca un nuevo mínimo o tu precio objetivo.
      ${d.target_price_usd ? `Tu objetivo: <b>USD ${d.target_price_usd}</b>.` : "Sin precio objetivo configurado."}
    </div>

    <h2>Todas las fechas (${d.results.length})</h2>
    <div class="sub" style="margin:-4px 0 12px">Ordenado por mejor relación precio/escalas${d.stop_penalty_usd ? ` (cada escala penaliza ~USD ${d.stop_penalty_usd})` : ""} — no solo por el precio más bajo. Buscar en: <b>G</b>=Google Flights · <b>K</b>=Kiwi · <b>D</b>=Despegar.</div>
    <table>
      <thead><tr>
        <th>Salida</th><th>Vuelta</th><th>Precio</th><th>Nivel</th>
        <th class="hide-sm">Aerolínea</th><th class="hide-sm">Escalas</th><th>Buscar</th>
      </tr></thead>
      <tbody>
        ${d.results.map((r,i) => `
          <tr class="${i===0?'best-row':''}">
            <td>${fmtDate(r.departure_date)}</td>
            <td>${fmtDate(r.return_date)}</td>
            <td class="price-cell">USD ${r.price_usd}</td>
            <td>${lvlBadge(r.price_level)}</td>
            <td class="hide-sm">${r.airline || "—"}</td>
            <td class="hide-sm">${stopsTxt(r.stops)}</td>
            <td><div class="xlinks">
              ${r.link ? `<a class="g" href="${r.link}" target="_blank" rel="noopener" title="Google Flights">G</a>` : ""}
              ${r.kiwi ? `<a href="${r.kiwi}" target="_blank" rel="noopener" title="Kiwi">K</a>` : ""}
              ${r.despegar ? `<a href="${r.despegar}" target="_blank" rel="noopener" title="Despegar">D</a>` : ""}
            </div></td>
          </tr>`).join("")}
      </tbody>
    </table>
  `;

  if (d.history && d.history.length > 1) {
    const vals = d.history.map(h => h.best_usd);
    const max = Math.max(...vals), min = Math.min(...vals);
    const span = max - min || 1;
    html += `<h2>Historial del mejor precio</h2>
      <div class="hist">${d.history.map(h => {
        const pct = 20 + 80*(h.best_usd - min)/span;
        return `<div class="bar" style="height:${pct}%" title="${h.checked_at.slice(0,10)}: USD ${h.best_usd}"></div>`;
      }).join("")}</div>
      <div class="sub" style="margin-top:6px">${d.history.length} chequeos · de USD ${min} a USD ${max}</div>`;
  }

  document.getElementById("content").innerHTML = html;
  const dt = new Date(d.generated_at);
  document.getElementById("foot").textContent =
    "Última actualización: " + dt.toLocaleString("es-AR", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) + " · precios reales vía Google Flights";
}
load();
</script>
</body>
</html>
