# Flight Hunter — sitio estático (sin build). Netlify sirve directamente
# la carpeta que genera el pipeline diario y commitea el workflow.
[build]
  publish = "flight-hunter/flights/public"
  functions = "netlify/functions"
  command = ""

# SPA-friendly: cualquier ruta cae al index (la app es de una sola página)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Que el navegador SIEMPRE revalide HTML y datos → no más versiones cacheadas viejas
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

