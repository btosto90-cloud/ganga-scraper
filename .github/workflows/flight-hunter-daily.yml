name: Flight Hunter — Daily

on:
  schedule:
    # 11:00 UTC (hora redonda) es pico de GitHub Actions y se saltea seguido.
    # 09:37 UTC = ~06:37 ART, fuera de horas pico → mucho más confiable.
    - cron: "37 9 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flight-hunter/flights

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flight-hunter/flights/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Plan Starter de SerpApi (1.000/mes): verificamos ~30 rutas/día (~900/mes).
          FLIGHT_PRICE_MAX_RESOLVE: "30"
        run: python run.py

      - name: Show output preview
        run: |
          echo "=== flights.json head ==="
          head -c 500 public/data/flights.json || true
          echo ""
          echo "=== stats ==="
          python -c "import json; d=json.load(open('public/data/flights.json')); print(json.dumps(d.get('stats',{}), indent=2)); print('Sources:', d.get('sources',{}))"

      - name: Commit changes
        run: |
          cd ../..
          git config user.name "flight-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add flight-hunter/flights/public/data/flights.json flight-hunter/flights/data/price_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(flights): daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      # Publica el sitio en Netlify (flighthunter-bruno.netlify.app). Usa la CLI
      # oficial de Netlify; no hay build, solo sube la carpeta estática.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@26 deploy --prod --dir public --message "daily flights refresh $(date -u +%Y-%m-%d)"
