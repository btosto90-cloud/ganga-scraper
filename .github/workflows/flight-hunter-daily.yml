name: Flight Hunter — Daily

on:
  schedule:
    # 3 corridas/día (6:37, 12:37, 18:37 UTC = 3:37, 9:37, 15:37 ART).
    # Las gangas duran horas, no días → polling más frecuente las caza antes
    # y dispara alerta Telegram al toque. SerpApi cachea iguales (free).
    # Minutos raros + off-peak → muy bajo skip-rate en GitHub Actions.
    - cron: "37 6,12,18 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flight-hunter/flights

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flight-hunter/flights/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Plan Starter (1.000/mes), 3 corridas/día: 11×3=33/día ≈ 990/mes.
          # SerpApi cachea iguales (free) → en corridas seguidas casi no gasta.
          # Selección inteligente prioriza rutas distintas → cobertura máxima.
          FLIGHT_PRICE_MAX_RESOLVE: "11"
          # Telegram para alertas cuando aparece 🟢 ganga verificada (dedup 24h).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Show output preview
        run: |
          echo "=== flights.json head ==="
          head -c 500 public/data/flights.json || true
          echo ""
          echo "=== stats ==="
          python -c "import json; d=json.load(open('public/data/flights.json')); print(json.dumps(d.get('stats',{}), indent=2)); print('Sources:', d.get('sources',{}))"

      - name: Commit changes
        run: |
          cd ../..
          git config user.name "flight-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add flight-hunter/flights/public/data/flights.json flight-hunter/flights/data/price_history.json flight-hunter/flights/data/flight_alerts_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(flights): daily refresh $(date -u +%Y-%m-%d)"
            # Reintento robusto: si alguien pusheó en el medio, rebase y reintenta.
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push falló (intento $i), rebase + retry..."
              git pull --rebase -X ours origin main || true
              sleep 2
            done
          fi
        # Aunque falle el commit/push, deployamos lo que generamos (no perdemos la corrida).
        continue-on-error: true

      # Publica el sitio en Netlify (flighthunter-bruno.netlify.app). Usa la CLI
      # oficial de Netlify; no hay build, solo sube la carpeta estática.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@26 deploy --prod --dir public --message "daily flights refresh $(date -u +%Y-%m-%d)"
