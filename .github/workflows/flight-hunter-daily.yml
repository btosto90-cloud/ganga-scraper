name: Flight Hunter — Daily

on:
  schedule:
    # 1 corrida/día (11:37 UTC = 8:37 ART). El vigilante escanea ~25 fechas de
    # UNA ruta → 25/día ≈ 750/mes (entra en SerpApi Starter 1.000 con margen).
    # Un vuelo a meses no necesita polling horario; un chequeo diario alcanza.
    - cron: "37 11 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flight-hunter/flights

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flight-hunter/flights/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Vigilar la ruta (watch_route.py)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # Tope de pares (ida,vuelta) por corrida. 25 ≈ 750/mes en 1 corrida/día.
          FLIGHT_WATCH_MAX_PAIRS: "25"
          # Telegram: alerta al tocar nuevo mínimo o tu precio objetivo (dedup 24h).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch_route.py

      - name: Show output preview
        run: |
          echo "=== watch.json best ==="
          python -c "import json; d=json.load(open('public/data/watch.json')); b=d['best']; print(d['route'], '| mejor USD', b['price_usd'], b['departure_date'], '->', b['return_date'], '|', b['airline'], b['stops'], 'esc |', b['price_level']); print('fechas escaneadas:', len(d['results']), '| best_ever:', d['best_ever_usd'])"

      - name: Commit changes
        run: |
          cd ../..
          git config user.name "flight-hunter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add flight-hunter/flights/public/data/watch.json flight-hunter/flights/data/watch_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(flights): watch refresh $(date -u +%Y-%m-%d)"
            # Reintento robusto: si alguien pusheó en el medio, rebase y reintenta.
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push falló (intento $i), rebase + retry..."
              git pull --rebase -X ours origin main || true
              sleep 2
            done
          fi
        # El push a main dispara el auto-deploy del sitio git-connected
        # flight-hunter90.netlify.app (el que usa Bruno). No hace falta deploy por CLI:
        # el paso viejo a flighthunter-bruno fallaba con 403 (token vencido) y dejaba
        # el workflow en rojo aunque la data se generaba bien.
